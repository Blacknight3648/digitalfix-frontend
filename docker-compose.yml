services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: digitalfix-frontend:latest
    container_name: digitalfix-frontend
    ports:
      # Host 4200 para coincidir con el Redirect URI registrado en Azure AD
      # (http://localhost:4200). El contenedor Nginx escucha internamente en el puerto 80.
      - "4200:80"
    restart: unless-stopped
