server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Los HTML nunca se cachean: así cada despliegue llega al navegador de
    # inmediato (el HTML apunta a los JS/CSS nuevos, que traen otro hash).
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # Rutas del router de Angular (SPA). Las pantallas internas se renderizan en
    # el cliente, así que el fallback es el shell CSR sin contenido pre-renderizado.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/index.html /index.csr.html;
    }

    # JS/CSS llevan hash en el nombre (outputHashing: all): se pueden cachear
    # para siempre porque un cambio genera un archivo con otro nombre.
    location ~* \.(?:js|css|woff2?|eot|ttf)$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Imágenes/íconos de /public no llevan hash: caché corta y revalidación.
    location ~* \.(?:ico|gif|jpe?g|png|svg|webp)$ {
        access_log off;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
