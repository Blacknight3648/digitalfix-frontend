<div class="app-shell" [class.menu-abierto]="menu.abierto()">
  <app-sidebar />
  <!-- Fondo oscuro del panel móvil: tocarlo cierra el menú -->
  <div class="menu-fondo" (click)="menu.cerrar()" aria-hidden="true"></div>
  <div class="content-wrapper">
    <app-topbar />
    <main class="content-body" id="contenido">
      <router-outlet />
    </main>
  </div>
</div>

<!-- Avisos flotantes y confirmaciones de toda la app (components/ui) -->
<app-notificaciones />
<app-confirmacion />
