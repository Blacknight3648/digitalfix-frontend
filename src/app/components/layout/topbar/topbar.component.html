<header class="topbar">
  <div class="topbar-title">
    <!-- Solo en pantallas angostas (≤ 880px), donde el menú es un panel deslizable -->
    <button
      class="icon-btn btn-menu"
      type="button"
      (click)="menu.alternar()"
      [attr.aria-expanded]="menu.abierto()"
      aria-controls="menu-principal"
      aria-label="Abrir menú"
    >
      <span class="material-icons">menu</span>
    </button>
    <nav class="breadcrumb" aria-label="Ubicación">
      <span class="breadcrumb-root">DigitalFix</span>
      <span class="material-icons breadcrumb-sep" aria-hidden="true">chevron_right</span>
      <span class="current-page" aria-current="page">{{ pageTitle() }}</span>
    </nav>
  </div>

  <div class="topbar-actions">
    @if (canSwitchRole) {
      <label class="role-switch" title="Ver la app con las vistas de otro rol (solo Superadmin)">
        <span class="material-icons" aria-hidden="true">visibility</span>
        <select class="role-select" [ngModel]="currentRole" (ngModelChange)="onRoleChange($event)" aria-label="Ver la app como otro rol">
          @for (role of roles; track role) {
            <option [value]="role">Ver como {{ roleLabel[role] }}</option>
          }
        </select>
      </label>
    }

    @if (currentUser) {
      <div class="user-chip" [title]="currentUser.name + ' · ' + currentUser.email">
        <span class="avatar" aria-hidden="true">{{ initials }}</span>
        <div class="user-text">
          <span class="user-name">{{ displayName }}</span>
          <span class="user-role">{{ roleLabel[currentUser.role] }}</span>
        </div>
      </div>
    }

    <button class="btn-logout" type="button" (click)="onLogout()" aria-label="Cerrar sesión" title="Cerrar sesión">
      <span class="material-icons">logout</span>
      <span class="logout-label">Salir</span>
    </button>
  </div>
</header>
