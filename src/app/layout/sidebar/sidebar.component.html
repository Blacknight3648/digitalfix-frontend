<aside class="sidebar" id="menu-principal" aria-label="Menú principal">
  <div class="sidebar-brand">
    <img class="brand-logo" src="/digitalfix-128.png" alt="" width="32" height="32" />
    <div class="brand-text">
      <span class="brand-name">DigitalFix</span>
      <span class="brand-sub">Órdenes de trabajo</span>
    </div>
    <button class="btn-cerrar-menu" type="button" (click)="menu.cerrar()" aria-label="Cerrar menú">
      <span class="material-icons">close</span>
    </button>
  </div>

  <nav class="nav-list">
    <span class="nav-section">Menú</span>
    @for (item of navItems; track item.path) {
      <a class="nav-link" [routerLink]="['/', item.path]" routerLinkActive="selected" [title]="item.label">
        <span class="material-icons" aria-hidden="true">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-spacer"></div>

  <div class="sidebar-footer">Versión del sistema 0.1.1</div>
</aside>
