<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-text">
      <span class="brand-name">DigitalFix</span>
      <span class="brand-sub">Órdenes de trabajo</span>
    </div>
  </div>

  <nav class="nav-list">
    <span class="nav-section">Menú</span>
    @for (item of navItems; track item.path) {
      <a class="nav-link" [routerLink]="['/', item.path]" routerLinkActive="selected" [title]="item.label">
        <span class="material-icons">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-spacer"></div>

  <div class="sidebar-footer">Versión del sistema 0.1.1</div>
</aside>
