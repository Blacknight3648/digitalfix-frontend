<div class="login-page">
    <div class="login-bg" aria-hidden="true"></div>
    <div class="login-overlay" aria-hidden="true"></div>

    <div class="login-content">
        <h1 class="login-title">Inicia sesión en tu cuenta</h1>

        <div class="login-card">
            <form (ngSubmit)="onSubmit()" novalidate>
                <div class="form-field">
                    <label for="email">Email</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        [(ngModel)]="email"
                        placeholder="usuario.ap@duocuc.cl"
                        autocomplete="username"
                    />
                </div>

                <div class="form-field">
                    <label for="password">Contraseña</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        [(ngModel)]="password"
                        placeholder="********"
                        autocomplete="current-password"
                    />
                </div>

                <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

                <button type="submit" class="btn-primary" [disabled]="isRedirecting">
                    {{ isRedirecting ? 'Redirigiendo...' : 'Iniciar sesión' }}
                </button>
            </form>
        </div>

        <div class="login-links">
            <button type="button" class="link-button">¿Olvidaste tu contraseña?</button>
            <button type="button" class="link-button">Problemas para iniciar sesión</button>
        </div>
    </div>
</div>
