<div class="login-page">
    <div class="login-bg" aria-hidden="true"></div>
    <div class="login-overlay" aria-hidden="true"></div>

    <div class="login-content">
        <h1 class="login-title">Inicia sesión en tu cuenta</h1>

        <div class="login-card">
            <form (ngSubmit)="onSubmit()" novalidate>
                <div class="form-field">
                    <label for="email">Email</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        [(ngModel)]="email"
                        placeholder="usuario.ap@duocuc.cl"
                        autocomplete="username"
                    />
                </div>

                <div class="form-field">
                    <label for="password">Contraseña</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        [(ngModel)]="password"
                        placeholder="********"
                        autocomplete="current-password"
                    />
                </div>

                <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

                <button type="submit" class="btn-primary">Iniciar sesión</button>
            </form>
        </div>

        <div class="login-links">
            <button type="button" class="link-button">¿Olvidaste tu contraseña?</button>
            <button type="button" class="link-button">Problemas para iniciar sesión</button>
        </div>

        <button type="button" class="btn-microsoft" (click)="loginWithMicrosoft()">
            <svg class="ms-logo" viewBox="0 0 21 21" aria-hidden="true">
                <rect x="1" y="1" width="9" height="9" fill="#f25022" />
                <rect x="11" y="1" width="9" height="9" fill="#7fba00" />
                <rect x="1" y="11" width="9" height="9" fill="#00a4ef" />
                <rect x="11" y="11" width="9" height="9" fill="#ffb900" />
            </svg>
            <span>Microsoft</span>
        </button>
    </div>
</div>
