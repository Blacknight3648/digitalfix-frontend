name: CI/CD - Frontend Web

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

concurrency:
  group: deploy-frontend-ec2
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test (Angular)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SSR
        run: npm run build

  deploy:
    name: Despliegue Centralizado
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Disparar CI/CD en digitalfix-infrastructure
        id: dispatch
        if: "${{ secrets.INFRA_DISPATCH_TOKEN != '' }}"
        run: |
          echo "==> Notificando a digitalfix-infrastructure para desplegar 'frontend'..."
          curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.INFRA_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/SolgreyDuocUC/digitalfix-infrastructure/dispatches \
            -d '{"event_type": "deploy-service", "client_payload": {"service": "frontend", "branch": "${{ github.ref_name }}"}}'
          echo "Notificación enviada exitosamente."

      - name: Despliegue directo vía SSH (usando script centralizado)
        if: "${{ secrets.INFRA_DISPATCH_TOKEN == '' && secrets.EC2_HOST != '' }}"
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            APP_DIR="${{ secrets.EC2_APP_DIR || secrets.EC2_DEPLOY_PATH }}"
            if [ -z "$APP_DIR" ]; then
              if [ -d "$HOME/DigitalFix" ]; then APP_DIR="$HOME/DigitalFix";
              elif [ -d "$HOME/digitalfix" ]; then APP_DIR="$HOME/digitalfix";
              else APP_DIR="$PWD"; fi
            fi

            if [ -d "$APP_DIR/digitalfix-infrastructure" ]; then
              INFRA_DIR="$APP_DIR/digitalfix-infrastructure"
            elif [ "$(basename "$APP_DIR")" = "digitalfix-infrastructure" ]; then
              INFRA_DIR="$APP_DIR"
            else
              INFRA_DIR="$(dirname "$APP_DIR")/digitalfix-infrastructure"
            fi

            echo "==> Ejecutando despliegue centralizado para frontend..."
            cd "$INFRA_DIR"
            git fetch origin deploy
            git reset --hard origin/deploy
            chmod +x deploy/deploy.sh
            ./deploy/deploy.sh frontend "${{ github.ref_name }}" true

      - name: Resumen de despliegue centralizado
        if: "${{ secrets.INFRA_DISPATCH_TOKEN == '' && secrets.EC2_HOST == '' }}"
        run: |
          echo "=========================================================================="
          echo " El despliegue de DigitalFix está centralizado en digitalfix-infrastructure."
          echo " Compilación exitosa para digitalfix-frontend."
          echo ""
          echo " Para desplegar a EC2:"
          echo "   1. Ve a: https://github.com/SolgreyDuocUC/digitalfix-infrastructure/actions"
          echo "   2. Selecciona 'Despliegue Centralizado DigitalFix a EC2'"
          echo "   3. Haz clic en 'Run workflow' y elige 'frontend' o 'all'."
          echo "=========================================================================="
