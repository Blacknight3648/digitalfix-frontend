name: Deploy Frontend to EC2

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

concurrency:
  group: deploy-frontend-ec2
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test (Angular)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SSR
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            # 1. Definir directorio base seguro si las variables de GitHub Secrets no están definidas
            TARGET_DIR="${{ secrets.EC2_APP_DIR || secrets.EC2_DEPLOY_PATH }}"
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="$HOME/digitalfix/digitalfix-infrastructure"
            fi

            echo "==> Navegando a $TARGET_DIR"
            cd "$TARGET_DIR"

            # 2. Configurar token de acceso usando el secret de GitHub (GH_PAT) si la URL usa HTTPS con credenciales
            if [ -n "${{ secrets.GH_PAT }}" ]; then
              git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
            fi

            echo "==> Actualizando código a lo último de origin/deploy"
            git fetch origin deploy
            git reset --hard origin/deploy

            echo "==> Reconstruyendo y levantando contenedor del Frontend"
            if [ -f docker-compose.prod.yaml ]; then
              docker compose -f docker-compose.prod.yaml up -d --build frontend || docker-compose -f docker-compose.prod.yaml up -d --build frontend
            elif [ -f docker-compose.yml ] || [ -f docker-compose.yaml ]; then
              docker compose up -d --build frontend || docker-compose up -d --build frontend
            elif [ -f ../digitalfix-infrastructure/docker-compose.yml ]; then
              docker compose -f ../digitalfix-infrastructure/docker-compose.yml up -d --build frontend || docker-compose -f ../digitalfix-infrastructure/docker-compose.yml up -d --build frontend
            fi

            echo "==> Limpiando imágenes colgadas o no utilizadas"
            docker image prune -f

            echo "==> Estado actual de los contenedores"
            docker compose ps || docker-compose ps
